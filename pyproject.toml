[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "GoodBooks"
version = "1.2.0"
description = "GoodReads to-read (RSS) -> Kindle automated delivery"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Nick", email = "nick@nickyg666.com"}
]
requires-python = ">=3.9"
dependencies = [
    "Flask>=2.0.0",
    "waitress>=2.0.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.9.0",
    "requests>=2.25.0",
    "lxml>=4.6.0",
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.0",
    "Pillow>=8.0.0",
    "pytz>=2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[project.scripts]
goodbooks = "goodbooks.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
goodbooks = ["templates/**/*", "static/**/*"]
