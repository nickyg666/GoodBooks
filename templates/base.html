<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="white">
    <title>{{ app_name }} - {{ title if title else 'Home' }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVJkEZSMUkrQ6usKu8zTwT3+UvPqrMAIUapTSc3+dPmYo2Ij31VkQvFmsg+PyHS+uTcDaZ1FDkw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Kindle e-ink specific optimizations */
        @supports (display: grid) {
            /* Only use grid on compatible devices */
        }
        /* Disable animations on e-ink devices */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="brand">{{ app_name }}</div>
    <div class="links">
        <a href="{{ url_for('index')}}">Library</a>
        <a href="{{ url_for('search') }}">Search</a>
        <a href="{{ url_for('feed_view') }}">Feeds</a>
        <a href="{{ url_for('settings') }}">Settings</a>
        <a href="{{ url_for('history') }}">History</a>
    </div>
</nav>
<div id="metadata-progress-container" class="metadata-progress-hidden">
    <div class="metadata-progress-bar">
        <div id="metadata-progress-fill" class="metadata-progress-fill" style="width: 0%"></div>
    </div>
    <div class="metadata-progress-text">
        <span id="metadata-progress-label">Refreshing metadata...</span>
        <span id="metadata-progress-eta">ETA: --</span>
    </div>
</div>
<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="flash-wrapper">
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message|safe }}</div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>

<script>
// Metadata refresh progress bar via SSE
document.addEventListener('DOMContentLoaded', function() {
    if (!window.EventSource) return;
    
    const container = document.getElementById('metadata-progress-container');
    const fill = document.getElementById('metadata-progress-fill');
    const label = document.getElementById('metadata-progress-label');
    const eta = document.getElementById('metadata-progress-eta');
    
    if (!container) return;
    
    const es = new EventSource("{{ url_for('metadata_stream') }}");
    
    es.onmessage = function(event) {
        try {
            const state = JSON.parse(event.data);
            updateMetadataProgressUI(state);
        } catch (e) {
            console.error('Failed to parse metadata progress', e);
        }
    };
    
    es.onerror = function(event) {
        console.error('Metadata stream error:', event);
        es.close();
    };
    
    function updateMetadataProgressUI(state) {
        if (!state || !state.active) {
            container.classList.add('metadata-progress-hidden');
            return;
        }
        
        container.classList.remove('metadata-progress-hidden');
        
        const total = state.total_books || 0;
        const completed = state.completed_books || 0;
        let pct = state.percentage || 0;
        pct = Math.max(0, Math.min(100, pct));
        
        fill.style.width = pct + '%';
        
        let labelText = 'Refreshing metadata...';
        if (total > 0) {
            labelText = `${completed}/${total} books - ${pct}%`;
        }
        label.textContent = labelText;
        
        let etaText = 'ETA: --';
        if (state.eta_seconds !== null && state.eta_seconds !== undefined && state.eta_seconds >= 0) {
            if (state.eta_seconds < 60) {
                etaText = `ETA: ${Math.ceil(state.eta_seconds)}s`;
            } else {
                const minutes = Math.ceil(state.eta_seconds / 60);
                etaText = `ETA: ${minutes}m`;
            }
        }
        eta.textContent = etaText;
    }
});
</script>
</body>
</html>
