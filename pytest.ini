[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --tb=short
markers =
    smoke: Quick endpoint smoke tests
    integration: Tests that hit live services
    slow: Tests that take a while
    download: download resolution and file validation
    isbn: EAN-13 barcode decoding
    mirrors: mirror lists and SLUM ranking
    libgen: libgen fallback wiring
    scan: scan + steal pipeline (ISBN / Lens)
    regression: anti-regression guards for previously fixed bugs
    resources: resource / cache / leak guards
filterwarnings =
    ignore::DeprecationWarning
