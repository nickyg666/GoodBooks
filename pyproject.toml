[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goodbooks"
version = "1.2.0"
description = "Goodreads to-read (RSS) -> Anna's Archive / LibGen -> download -> Kindle delivery"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nick", email = "nick@nickyg666.com" }]
requires-python = ">=3.9"
dependencies = [
    "Pillow",
    "beautifulsoup4",
    "calibre",
    "feedparser",
    "flask",
    "imagehash",
    "libgen_api_enhanced",
    "lxml",
    "playwright",
    "playwright-stealth",
    "pychromecast",
    "pypdf",
    "requests",
    "six",
    "waitress",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "flake8>=4.0.0"]

# No console script on purpose. This is a service, not a CLI: it starts a
# Flask server and a background maintenance thread. The previous
# "goodbooks = goodbooks.app:main" entry point pointed into a src/ layout
# that no longer exists, so it could never have been created. Use
# deploy/install.sh.

# FLAT module tree, not src/ layout. setuptools cannot discover a flat tree
# with packages.find, so every module is listed. Keep this in step when a
# module is added or removed; scripts/check_packaging.py verifies it.
[tool.setuptools]
py-modules = [
  "amazon_cover_fetcher",
  "app",
  "build_epub_v2",
  "clean_lorenzo_inappropriate",
  "clean_lorenzo_library",
  "cover_cache_manager",
  "debug_progress_bars",
  "ebook_metadata_extractor",
  "epub_distributor",
  "gb_abjob",
  "gb_audiobook",
  "gb_audit",
  "gb_authors",
  "gb_epub_urls",
  "gb_fastdl",
  "gb_goodreads",
  "gb_gr_run",
  "gb_isbn",
  "gb_keyed",
  "gb_lens",
  "gb_libgen_dl",
  "gb_match",
  "gb_mirrors_live",
  "gb_ol_par",
  "gb_ol_repair",
  "gb_extract",
  "gb_parallel",
  "gb_retry",
  "gb_plugins",
  "gb_openlib",
  "gb_reading",
  "goodbooks_delivery",
  "goodreads_epub_utils",
  "goodreads_scraper",
  "libgen_ua_patch",
  "library_cleanup",
  "logging_config",
  "parser_engine",
  "post_install",
  "search_engine",
  "settings_manager",
  "slum_canonical",
  "stealth_browser"
]
include-package-data = true

[tool.setuptools.data-files]
"share/goodbooks/templates" = ["templates/*.html"]
"share/goodbooks/static" = ["static/*.css", "static/*.js"]
"share/goodbooks/static/themes" = ["static/themes/*.css"]

[tool.setuptools.package-data]
# Plugins are loaded by PATH at runtime by gb_plugins.PluginManager,
# never imported as a package, so they are data rather than modules.
"*" = ["plugins/*/plugin.json", "plugins/*/*.py"]
